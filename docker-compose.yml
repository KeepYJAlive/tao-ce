name: tao-ce

services:
  tao:
    configs:
      - source: tao_config
        target: /etc/tao-ce/config/tao.yaml
        mode: 0644
   
    image: keepyjalive/tao-ce:dev
    extra_hosts:
    - ${TAO_CE_PUBLIC_DOMAIN:-community.tao.internal}:0.0.0.0
    ports:
    - "8443:443"
    cgroup: host
    volumes:
    - /sys/fs/cgroup:/sys/fs/cgroup:rw
    - tao-ce-lib:/var/lib/tao-ce:rw
    privileged: true
    depends_on:
      es:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -fk
      - --resolve
      - ${TAO_CE_PUBLIC_DOMAIN:-community.tao.internal}:443:127.0.0.1
      - https://${TAO_CE_PUBLIC_DOMAIN:-community.tao.internal}/portal/
      interval: 10s
      timeout: 30s
      retries: 1
      start_period: 10s
      start_interval: 5s

    links:
    - redis:redis
    - es:es
    - pubsub:pubsub
    - firestore:firestore


configs:
  tao_config:
    content: |
      spec:
        publicDomain: ${TAO_CE_PUBLIC_ORIGIN:-community.tao.internal:8443}
        defaultLocale: ${TAO_CE_DEFAULT_LOCALE:-en-US}
        contentStorage:
          type: ${TAO_CONTENT_STORAGE_TYPE:-filesystem}
          projectId: ${TAO_GCP_PROJECT_ID:-}
          bucketName: ${TAO_GCS_BUCKET_NAME:-}
          bucketDirectory: ${TAO_GCS_BUCKET_DIRECTORY:-content-service}
          linkTtlMinutes: ${TAO_GCS_LINK_TTL_MINUTES:-10}
          signRequired: ${TAO_GCS_SIGN_REQUIRED:-true}
        dependencies:
        - key: pubsub
          type: pubsub
          address:
            schema: http
            port: 8432
            host: pubsub
        - key: firestore
          type: firestore
          address:
            schema: http
            port: 8080
            host: firestore
        - key: es
          type: es
          address:
            schema: http
            port: 9200
            host: es
        - key: pgsql
          type: pgsql
          address:
            schema: pgsql
            port: ${TAO_PG_PORT:-5432}
            host: ${TAO_PG_HOST:-pgsql}
          database: ${TAO_PG_DATABASE:-tao}
          username: ${TAO_PG_USER:-tao}
          password: ${TAO_PG_PASSWORD}
        - key: redis
          type: redis
          address:
            schema: redis
            host: redis
                  

include:
- ./docker-compose.stack.yml

volumes:
  tao-ce-opt: {}
  tao-ce-lib: {}
  containers: {}

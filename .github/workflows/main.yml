name: Deploy to Production
on:
  workflow_run:
    workflows:
      - "Build TAO CE Image"
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: tao-ceo-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Determine deployment version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          SHA="${{ github.event.workflow_run.head_sha }}"
          SHORT_SHA="${SHA:0:7}"

          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/keepyjalive/tao-ce:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          echo "Deploying commit: ${SHA}"
          echo "Deploying image: ghcr.io/keepyjalive/tao-ce:sha-${SHORT_SHA}"

      - name: Deploy TAO
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_SHA: ${{ steps.version.outputs.sha }}
          TAO_IMAGE: ${{ steps.version.outputs.image }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          envs: DEPLOY_SHA,TAO_IMAGE
          script: |
            set -euo pipefail

            REPO=/opt/keepyjalive/tao/repo
            ENV_FILE=/opt/keepyjalive/tao/config/.env

            echo "=== TAO Deployment ==="
            echo "Commit: $DEPLOY_SHA"
            echo "Image:  $TAO_IMAGE"

            cd "$REPO"

            echo "=== Updating repository ==="
            git fetch --prune origin

            # Refuse to deploy an image against the wrong source/config.
            git cat-file -e "${DEPLOY_SHA}^{commit}"

            git checkout main
            git reset --hard "$DEPLOY_SHA"

            echo "Repository now at:"
            git rev-parse HEAD

            export TAO_IMAGE

            COMPOSE="docker compose \
              --env-file $ENV_FILE \
              -f docker-compose.yml \
              -f docker-compose.prod.yml"

            echo "=== Validating production configuration ==="
            $COMPOSE config --quiet

            echo "=== Pulling TAO image ==="
            $COMPOSE pull tao

            echo "=== Starting TAO ==="
            $COMPOSE up -d --force-recreate tao

            echo "=== Waiting for TAO health ==="
            TAO_CONTAINER="$($COMPOSE ps -q tao)"

            if [ -z "$TAO_CONTAINER" ]; then
              echo "TAO container was not created."
              exit 1
            fi

            for attempt in $(seq 1 30); do
              STATUS="$(docker inspect \
                --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                "$TAO_CONTAINER")"

              echo "TAO health: $STATUS"

              if [ "$STATUS" = "healthy" ]; then
                break
              fi

              if [ "$STATUS" = "unhealthy" ]; then
                echo "TAO became unhealthy."
                $COMPOSE logs --tail=100 tao
                exit 1
              fi

              if [ "$attempt" -eq 30 ]; then
                echo "Timed out waiting for TAO health."
                $COMPOSE logs --tail=100 tao
                exit 1
              fi

              sleep 5
            done

            echo "=== Deployment status ==="
            $COMPOSE ps

            echo "TAO deployment completed successfully."